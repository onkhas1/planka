<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — Планка</title>
<meta name="description" content="Вещи проверенных брендов одежды: джинсы, верхняя одежда, трикотаж, обувь, сумки. Фильтр по категории и цене, покупка на сайте бренда.">
<meta name="theme-color" content="#f7f9f8">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Каталог — Планка">
<meta property="og:description" content="Каталог небольших брендов одежды. Каждый проверяем сами: стаж, отзывы, качество вещей. Покупаете на сайте бренда по его цене.">
<meta property="og:image" content="og.png">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wdth,wght@75..150,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="planka.css?v=12">
</head>
<body>
<main class="page">
  <div class="topbar"><a href="index.html" aria-label="Планка, на главную"><b class="disp">Планка</b></a><nav aria-label="Разделы"><a href="catalog.html" aria-current="page">Каталог</a><a href="all-brands.html">Бренды</a><a href="brands.html">Брендам</a></nav></div>
  <nav class="crumbs" id="crumbs" aria-label="Где вы"></nav>
  <section id="steps" aria-live="polite"></section>
  <section id="listing" hidden>
    <div class="shop-head"><h1 id="lh">Каталог</h1><span class="cnt" id="count"></span></div>
    <div class="chips subs" id="subs" role="group" aria-label="Тип"></div>
    <div class="shop-tools">
      <button type="button" class="fbtn" id="fBtn" aria-controls="filters" aria-expanded="false">Фильтры <span id="fN"></span></button>
      <label class="sort">Сортировка
        <select id="sort">
          <option value="new">Сначала новые</option>
          <option value="rating">По оценке бренда</option>
          <option value="years">По стажу бренда</option>
          <option value="cheap">Сначала дешевле</option>
          <option value="dear">Сначала дороже</option>
        </select>
      </label>
    </div>
    <div class="list-wrap">
      <aside class="filters" id="filters" aria-label="Фильтры">
        <div class="f-top"><b>Фильтры</b><button type="button" class="f-close" id="fClose" aria-label="Закрыть фильтры"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg></button></div>
        <fieldset><legend>Цена, ₽</legend><div class="f-price"><label><span class="vh">от</span><input type="number" id="pmin" inputmode="numeric" min="0" step="100" placeholder="от"></label><label><span class="vh">до</span><input type="number" id="pmax" inputmode="numeric" min="0" step="100" placeholder="до"></label></div></fieldset>
        <fieldset><legend>Бренд на рынке</legend><div class="f-opts" data-f="yrs"><button type="button" data-v="">Любой стаж</button><button type="button" data-v="3">от 3 лет</button><button type="button" data-v="5">от 5 лет</button></div></fieldset>
        <fieldset><legend>Оценка бренда</legend><div class="f-opts" data-f="rate"><button type="button" data-v="">Любая</button><button type="button" data-v="4.7">от 4,7</button><button type="button" data-v="4.85">от 4,85</button></div></fieldset>
        <fieldset><legend>Бренды</legend><div class="f-brands" id="fBrands"></div></fieldset>
        <div class="f-act"><button type="button" class="btn" id="fShow">Показать</button><button type="button" class="link" id="fReset">Сбросить</button></div>
      </aside>
      <div>
        <div class="items-grid" id="shop"></div>
        <p class="empty" id="empty" hidden>Под эти фильтры ничего нет. <button type="button" class="link" id="emptyReset">Сбросить фильтры</button></p>
      </div>
    </div>
  </section>
  <p class="note" style="margin-top:56px">Вещи, цены и бренды здесь пока примеры.</p>
</main>

<dialog class="pd" id="pd" aria-labelledby="pd-name"></dialog>
<footer class="foot">
  <span>Небольшие марки одежды</span>
  <nav aria-label="Подвал"><a href="all-brands.html">Бренды</a><a href="brands.html">Брендам</a><a href="#" data-cfg="tgChannel" data-soon="Канал запустим вместе с первыми брендами.">Telegram</a></nav>
  <span>2026, <a href="privacy.html">политика конфиденциальности</a>. Фото: Unsplash</span>
</footer>

<script src="config.js?v=2"></script>
<script src="data/brands.js?v=5"></script>
<script src="app.js?v=9"></script>
</body>
</html>
